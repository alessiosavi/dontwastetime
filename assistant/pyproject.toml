[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "operator-assistant"
version = "0.1.0"
description = "Operator assistant over dontwastetime"
requires-python = ">=3.12,<3.14"
dependencies = [
    "mcp>=1.30,<1.31",
    "harness2 @ git+https://github.com/google-research/harness2@6868817518876de8fd170c6a8354daca273b6191",
]

[project.scripts]
assistant = "assistant.cli:main"

[dependency-groups]
dev = ["pytest>=9,<10"]

[tool.hatch.build.targets.wheel]
packages = ["src/assistant"]

[tool.hatch.build.targets.wheel.force-include]
"bench_data" = "assistant/bench_data"

[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = '-m "not integration"'
markers = ["integration: invokes real services or models (opt in explicitly)"]
